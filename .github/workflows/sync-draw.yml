name: 同步开奖数据

# GitHub Pages 是静态托管，跑不了 server.js。
# 所以让 GitHub 的服务器替页面去抓：定时把最新一期写进 data.json 提交回仓库，
# 页面读同源的 data.json，既绕开跨域，也不用任何第三方代理。
#
# 开奖时间：每周二、四、日 21:15（北京时间 = UTC 13:15）。
#
# ⚠️ 已知事实（2026-10-30 实测）：福彩官网只对国内 IP 开放，GitHub 的
#    服务器在海外，抓取会失败——本工作流跑一次不更新一次数据。留着是因为
#    成本为零，万一哪天通了自动就好；真要保证线上是新的，用仓库根目录的
#    sync-push.bat（本机国内网络抓取后推送）。
#
# ⚠️ 另外：cron 写 */15 也没用。GitHub 对免费仓库的定时任务会限流，
#    实测间隔 3–7 小时（记录：00:33 → 20:49 → 15:49 → 08:49）。

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  # 只在这个脚本或本文件本身改动时跑，避免 data.json 的提交再次触发自己
  push:
    branches: [main]
    paths:
      - "scripts/sync-draw.js"
      - "scripts/sync-history.js"
      - ".github/workflows/sync-draw.yml"

permissions:
  contents: write

concurrency:
  group: sync-draw
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取最新一期
        # || true：抓不到不算失败。脚本用退出码 2 表示抓取失败，
        # 直接透传会让每次运行都红、天天发邮件。
        run: node scripts/sync-draw.js || true

      - name: 抓取近 100 期历史（奖金曲线用）
        run: node scripts/sync-history.js || true

      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain data.json history.json)" ]; then
            echo "data.json / history.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          git commit -m "chore: 同步开奖数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
